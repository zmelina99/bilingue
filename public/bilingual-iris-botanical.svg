<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 760" fill="none" role="img" aria-labelledby="title desc" preserveAspectRatio="xMinYMax meet">
<title id="title">Art Nouveau iris botanical ornament</title>
<desc id="desc">Blue irises on gracefully bending stems growing diagonally from the lower-left, with sage leaves and fine antique-gold outlines.</desc>
<g stroke-linecap="round" stroke-linejoin="round">
